<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのホームページ</title>
  <!-- まるっこくてかわいいフォント -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 色の設定（ここを変えると全体の色が変わります） ===== */
    :root {
      --pink: #ff8fb1;
      --pink-light: #ffe3ec;
      --mint: #a8e6cf;
      --yellow: #fff3b0;
      --purple: #cdb4ff;
      --text: #5a4a52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
      color: var(--text);
      background-color: #fff7fa;
      /* 水玉もよう */
      background-image: radial-gradient(var(--pink-light) 20%, transparent 21%),
                        radial-gradient(var(--pink-light) 20%, transparent 21%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      line-height: 1.8;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ===== プロフィールのカード ===== */
    .profile {
      background: white;
      border-radius: 32px;
      padding: 40px 24px 32px;
      text-align: center;
      box-shadow: 0 8px 0 var(--pink-light), 0 12px 30px rgba(255, 143, 177, 0.25);
      border: 3px solid var(--pink);
    }

    .icon {
      width: 130px;
      height: 130px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-light), var(--yellow));
      border: 4px solid var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      animation: fuwafuwa 3s ease-in-out infinite;
    }

    /* ふわふわ動くアニメーション */
    @keyframes fuwafuwa {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--pink);
      letter-spacing: 0.1em;
    }

    .nickname {
      margin: 4px 0 16px;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .message {
      display: inline-block;
      background: var(--pink-light);
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: bold;
    }

    /* ===== 各セクション ===== */
    .section {
      background: white;
      border-radius: 24px;
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .section h2 {
      margin: 0 0 16px;
      font-size: 1.3rem;
      display: inline-block;
      padding: 2px 16px;
      border-radius: 999px;
    }

    .about h2 { background: var(--mint); }
    .likes h2 { background: var(--yellow); }
    .dream h2 { background: var(--purple); }

    /* プロフィール表 */
    .about dl {
      display: grid;
      grid-template-columns: 7em 1fr;
      gap: 8px 12px;
      margin: 0;
    }
    .about dt { font-weight: bold; color: var(--pink); }
    .about dd { margin: 0; }

    /* 好きなものタグ */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .tags li {
      background: var(--pink-light);
      padding: 6px 16px;
      border-radius: 999px;
      transition: transform 0.2s;
      cursor: default;
    }
    .tags li:hover { transform: scale(1.1) rotate(-3deg); }

    .dream p { margin: 0; }

    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* スマホでは表を縦並びに */
    @media (max-width: 480px) {
      .about dl { grid-template-columns: 1fr; gap: 0; }
      .about dd { margin-bottom: 8px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ===== プロフィール（名前やひとことを書きかえてね） ===== -->
    <header class="profile">
      <div class="icon">🐰</div>
      <h1>なまえ</h1>
      <p class="nickname">ニックネーム：〇〇ちゃん</p>
      <p class="message">はじめまして！よろしくね ♡</p>
    </header>

    <!-- ===== わたしについて ===== -->
    <section class="section about">
      <h2>🌷 わたしについて</h2>
      <dl>
        <dt>たんじょうび</dt><dd>5月2日</dd>
        <dt>すんでるところ</dt><dd>〇〇県</dd>
        <dt>しゅみ</dt><dd>カフェめぐり、おえかき</dd>
        <dt>とくぎ</dt><dd>すぐに眠れること</dd>
      </dl>
    </section>

    <!-- ===== 好きなもの ===== -->
    <section class="section likes">
      <h2>🍓 すきなもの</h2>
      <ul class="tags">
        <li>🍰 ケーキ</li>
        <li>🐱 ねこ</li>
        <li>🎵 音楽</li>
        <li>🌸 お花</li>
        <li>📚 マンガ</li>
        <li>☕ カフェラテ</li>
      </ul>
    </section>

    <!-- ===== 目標 ===== -->
    <section class="section dream">
      <h2>⭐ いまの目標</h2>
      <p>Claude Code をつかって、自分だけのホームページをどんどんかわいくすること！</p>
    </section>

    <footer>© わたしのホームページ</footer>
  </div>
</body>
</html>
